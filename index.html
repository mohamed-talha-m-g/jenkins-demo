<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jenkins CI/CD Demo....</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      max-width: 500px;
    }
    h1 { margin-top: 0; }
    .version {
      display: inline-block;
      margin-top: 15px;
      padding: 6px 14px;
      background: #28a745;
      border-radius: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Deployed by Jenkins 🚀</h1>
    <p>This page was automatically deployed when code was pushed to GitHub.</p>
    <p>GitHub Push → Webhook → Jenkins → Web Server</p>
    <!-- Change this version and push to see the auto-deploy in action -->
    <span class="version">Version 1.0</span>
  </div>
</body>
</html>
